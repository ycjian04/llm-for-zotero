name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # No test gate here on purpose. Tests run on every push to main via ci.yml,
  # which is where a red suite should be noticed and fixed. Publishing must not
  # be blocked by them -- a flaky test is not a reason a release cannot ship.
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      # `zotero-plugin release` builds its changelog from `git log` since the
      # previous version tag. This fork carries no upstream tags, so that log
      # spans the whole history and overflows execSync (ENOBUFS). Publish the
      # two releases Zotero's updater reads with gh instead.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .scaffold/build/llm-for-zotero.xpi --clobber
          else
            gh release create "$TAG" .scaffold/build/llm-for-zotero.xpi \
              --target "$GITHUB_SHA" --title "Release $TAG" \
              --notes "Install llm-for-zotero.xpi in Zotero (Tools > Plugins)." \
              --latest
          fi
          if ! gh release view release >/dev/null 2>&1; then
            gh release create release --target "$GITHUB_SHA" --prerelease \
              --latest=false --title "Update manifest" \
              --notes "update.json for Zotero's automatic updates."
          fi
          gh release upload release .scaffold/build/update.json \
            .scaffold/build/update-beta.json --clobber
